# dataset
dataset: "sky_img"

data_path: "/path/to/datasets/sky_timelapse/sky_train/" # s/p
pretrained_model_path: None # Please download pre-trained models from https://huggingface.co/maxin-cn/Latte/tree/main

# save and load
results_dir: "./results_img"
pretrained: None

# model config: 
model: LatteIMG-XL/2
num_frames: 16
image_size: 256 # choices=[256, 512]
num_sampling_steps: 250
frame_interval: 3
fixed_spatial: False
attention_bias: True
learn_sigma: True
extras: 1 # [1, 2] 1 unconditional generation, 2 class-conditional generation

# train config:
save_ceph: True # important
use_image_num: 8 # important
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 20000
local_batch_size: 4 # important
max_train_steps: 1000000
global_seed: 3407
num_workers: 8
log_every: 50
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1 # TODO
num_classes:

# low VRAM and speed up training
use_compile: False
mixed_precision: False
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False
vae_model_name: WVAE_Compressed_TopK_multi_wavelet
vae_from_pretrained: /scratch/cs/vidgen/guanjr/experiment/WFVAE_Experiment/WVAE_Channel_Keepratio_0.5_no_teacher_loss_32_channels_topk_twh_32frame-lr1.00e-05-bs4-rs256-sr1-fr32-cons0.0-p1_300000-p2_0-modetv_l1-20251026_215508/checkpoint-40000.ckpt
vae_model_config: /scratch/cs/vidgen/guanjr/project/latent_wf_vae_new/examples/WVAE_compressed_topk_multi_wavelet/wfvae-temporal-compressed-example-topk-twh-handcraft.json
